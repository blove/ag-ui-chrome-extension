<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="AG-UI DevTools">
  <!--
    A paper plane, for Threadplane. Original artwork: the threadplane.ai favicon is a placeholder
    (an inline SVG holding the small-airplane emoji character), and an emoji glyph baked into a
    shipped raster is both a licensing problem and a per-platform rendering one, since the result
    would depend on which machine ran `pnpm icons`.

    Two flat shapes, not one, and no stroke anywhere. The fold line that makes a dart read as
    FOLDED PAPER rather than as a plain arrow is the boundary between them, so it survives
    rasterisation at any size instead of thinning to nothing the way a hairline would. The lower
    wing is a flat tint rather than white at reduced alpha, so the 16px render composites the same
    way on every background.

    The tile is filled because Chrome draws toolbar icons over both light and dark chrome, and a
    bare glyph disappears into one of them.

    Colours are the panel's own accent token, written here without the leading hyphen pair on
    purpose: XML forbids two adjacent hyphens anywhere inside a comment body, not only at the
    delimiters, and Chrome answers by refusing to parse the whole file. It still rasterises to
    PNGs of exactly the right dimensions, so `file` reports success on a broken image.
  -->
  <rect width="128" height="128" rx="28" fill="#1a73e8"/>
  <path d="M113 19 13 60l49 8z" fill="#ffffff"/>
  <path d="M113 19 62 68l-4 48z" fill="#a8c7fa"/>
</svg>
