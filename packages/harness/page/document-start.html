<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AG-UI harness — document_start</title>
    <script>
      // The conn-open re-statement, exercised.
      //
      // This page starts its stream the moment the MAIN-world marker appears — the earliest
      // instant at which capture exists at all. `EventSource` posts `conn-open` synchronously
      // from its constructor, and `conn-open` is the message carrying `RunAgentInput`, so that
      // is the message at risk if the ISOLATED relay is not listening yet. The MAIN world
      // re-states it ahead of the first `frames` batch; the stream's first event is delayed
      // server-side, exactly as a real network response is.
      //
      // HISTORY, because it explains the shape of this file. Both content scripts used to be
      // emitted as CRXJS loaders that `await import(...)`ed their real chunk, so neither had run
      // when the parser reached this script and the wait above was the only way to reach capture
      // at all. Both are now self-contained IIFEs, so the wait is no longer load-bearing here —
      // but the re-statement it exercises still is, because MAIN and ISOLATED injection order is
      // not guaranteed, least of all for the two independent scripts
      // `chrome.scripting.registerContentScripts` creates on a runtime-granted origin.
      //
      // `document-start-sync.html` is the version of this page that waits for nothing, and is
      // what covers the synchronous case the loader made impossible.
      (function waitForCapture() {
        if (!window.__AGUI_DEVTOOLS__) {
          setTimeout(waitForCapture, 0);
          return;
        }
        const source = new EventSource('/agui-document-start');
        source.onmessage = (event) => {
          // Closing on the terminal event stops `EventSource` reconnecting on its own; a retry
          // would open a SECOND connection and the test asserts on exactly one request line.
          if (String(event.data).includes('RUN_FINISHED')) source.close();
        };
        source.onerror = () => {
          source.close();
        };
        document.getElementById('ready')?.setAttribute('data-started', 'true');
      })();
    </script>
  </head>
  <body>
    <h1>document_start capture window</h1>
    <p id="ready">ready</p>
  </body>
</html>
