<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AG-UI harness — document_start</title>
    <script>
      // The async-load window, reproduced.
      //
      // BOTH content scripts are injected at `document_start` and BOTH are wrapped by CRXJS in a
      // loader that `await import(...)`s the real chunk, so neither has run when the parser
      // reaches this inline script. The MAIN-world loader resolves a plain relative specifier;
      // the ISOLATED one additionally goes through `chrome.runtime.getURL` and a
      // web-accessible-resource fetch, so MAIN is the likelier of the two to win.
      //
      // This page therefore starts the moment the MAIN-world marker appears — the earliest
      // instant at which capture exists at all — which is squarely inside the window where the
      // ISOLATED relay may not yet be listening. `EventSource` posts `conn-open` synchronously
      // from its constructor, and `conn-open` is the message carrying `RunAgentInput`, so that
      // is the message at risk. The MAIN world re-states it ahead of the first `frames` batch;
      // the stream's first event is delayed server-side, exactly as a real network response is.
      //
      // MEASURED LIMITATION, not covered by the re-statement: a stream opened before the
      // MAIN-world loader resolves — an inline script at the very top of `<head>` with no wait —
      // is invisible to capture entirely, because `EventSource` has not been patched yet. That
      // needs an import-free MAIN entry, not a protocol change.
      (function waitForCapture() {
        if (!window.__AGUI_DEVTOOLS__) {
          setTimeout(waitForCapture, 0);
          return;
        }
        const source = new EventSource('/agui-document-start');
        source.onmessage = (event) => {
          // Closing on the terminal event stops `EventSource` reconnecting on its own; a retry
          // would open a SECOND connection and the test asserts on exactly one request line.
          if (String(event.data).includes('RUN_FINISHED')) source.close();
        };
        source.onerror = () => {
          source.close();
        };
        document.getElementById('ready')?.setAttribute('data-started', 'true');
      })();
    </script>
  </head>
  <body>
    <h1>document_start capture window</h1>
    <p id="ready">ready</p>
  </body>
</html>
