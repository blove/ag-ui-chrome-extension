name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: typecheck, lint, test, build, visual gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No `version:` input on purpose. pnpm/action-setup reads the pnpm version from the
      # root package.json `packageManager` field (pinned to pnpm 10), and it fails with
      # "Multiple versions of pnpm specified" if a `version:` input disagrees with it.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Everything down to the Build step installs the browsers the two browser-driven gates
      # need. It sits after typecheck and lint — the two cheapest gates — but BEFORE Build and
      # Test, because `pnpm test` includes the harness capture e2e and that e2e launches a
      # browser.
      #
      # `pnpm exec` is filtered to a package because Playwright is a devDependency of
      # `ag-ui-devtools` and `ag-ui-harness` and NOT of the workspace root, so a bare
      # `pnpm exec playwright` at the root fails with "Command 'playwright' not found".
      #
      # Two packages now drive a browser — `ag-ui-devtools` for the visual gate and
      # `ag-ui-harness` for the capture e2e — out of ONE cached browser directory. That only
      # works while they agree on the version, so the disagreement is made loud here rather than
      # left to surface as "executable doesn't exist" halfway down the job.
      - name: Resolve the Playwright version
        id: playwright
        run: |
          version="$(pnpm --filter ag-ui-devtools exec playwright --version | awk '{print $2}')"
          harness="$(pnpm --filter ag-ui-harness exec playwright --version | awk '{print $2}')"
          if [ "$version" != "$harness" ]; then
            echo "Playwright version mismatch: devtools $version, harness $harness." >&2
            echo "One cached browser serves both packages; pin them to the same version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Keyed on Playwright's own version, not the lockfile hash: Playwright pins the exact
      # Chromium build it can drive, so a cache entry is only reusable while that version is
      # unchanged. No `restore-keys` for the same reason — a prefix match here would restore a
      # Chromium the installed Playwright refuses to launch.
      #
      # The `-ext1` suffix is not decoration. The install step below changed from one browser to
      # two, and the KEY did not otherwise change: a cache entry written by the old step holds
      # only `chromium-headless-shell`, and restoring it would satisfy `cache-hit` while leaving
      # the full Chromium the harness e2e needs missing. Bump this suffix whenever the set of
      # installed browsers changes.
      - name: Cache the Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ext1-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Two browsers, because the two gates need different ones.
      #
      # `chromium-headless-shell` is what the visual gate drives: measured, 199 MB / 7.0s instead
      # of 558 MB / 13.7s, and it is what `chromium.launch()` actually starts, since Playwright
      # resolves a default headless launch to the shell.
      #
      # The harness e2e needs the FULL `chromium`. An MV3 extension loads only through
      # `launchPersistentContext` with `--disable-extensions-except` + `--load-extension`
      # (verified fact 7), and the headless shell is a separate binary built without the
      # extensions stack — it does not merely ignore the flags, it launches happily, registers
      # no service worker, and reports no error, so the e2e would pass having tested nothing.
      #
      # `--with-deps` resolves both to the same apt group.
      - name: Install the Chromium builds
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter ag-ui-devtools exec playwright install --with-deps chromium chromium-headless-shell

      # The cache carries the browsers but not the apt packages they link against, so a cache
      # hit still has to install the system libraries — just not re-download 750 MB of browser.
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter ag-ui-devtools exec playwright install-deps chromium

      # The harness e2e asserts against a real `dist/`, so build before testing rather
      # than after. The devtools unit suites do not depend on it either way.
      - name: Build
        run: pnpm build

      # `pnpm test` at the root resolves through `pnpm -r run test:ci`, NOT `pnpm -r test`.
      # pnpm treats `test` as a lifecycle name and `pnpm -r test` exits 0 when no package
      # defines it, which would let this job report green having run zero tests.
      #
      # This is both suites: the devtools unit projects, and the harness Playwright suite —
      # which includes the capture e2e. That e2e is the only gate that watches the extension
      # CAPTURE: `inject/`, `relay/` and the service worker run in a real browser or not at
      # all, and 918 unit tests can only agree with our own idea of what a stream looks like
      # (design §1). It serves fixtures over real SSE, drives them with the real
      # `@ag-ui/client`, and reads the ring buffer out of the MV3 service worker (H4/H5),
      # against the `dist/` its global setup just rebuilt.
      #
      # No key, no upstream, no network: CI only ever replays committed fixtures (decision H8).
      - name: Test
        run: pnpm test

      # Asserts things no other gate can see: that each manifest entry's emitted chunk holds
      # the code it should (a basename collision silently swapped two of them once), that the
      # privacy invariants hold in the built manifest, that the panel HTML reached dist/, and
      # that no sourcemap did.
      - name: Verify build output
        run: pnpm verify:build

      # The store listing copy is a versioned file, and every field it carries has a limit that is
      # otherwise discovered at the upload form, halfway through a submission. It also asserts that
      # the manifest's permissions and the listing's justifications agree in BOTH directions: add a
      # permission and forget to justify it, and the listing silently stops answering the question
      # a reviewer will ask. Needs no browser and no dist/, so it is nearly free.
      - name: Verify listing copy
        run: pnpm verify:listing

      # WHY THIS STEP EXISTS. Every gate above it — typecheck, lint, test, build, verify:build —
      # passed on the previous milestone's `dist/`, whose panel had NO STYLESHEET AT ALL. None of
      # them renders anything, so none of them could see it: the panel document is isolated and
      # inherits nothing, and with no CSS it fell back to UA defaults — black text on a
      # transparent ground, invisible under the DevTools dark theme. A human loading the unpacked
      # extension was the only thing that caught it. Leaving that set as the whole gate means the
      # next regression of that class ships. This step is the human, automated: it loads the
      # built panel in a real browser, asserts it is painted in both colour schemes and that the
      # two differ, and drives the fixtures through the panel's own file input to prove real data
      # renders.
      #
      # It also drives EXPORT and asserts a real click produces a real file with real content.
      # Design decision E1 saves through `Blob` + `URL.createObjectURL` + a programmatic anchor
      # specifically so no `downloads` permission is needed (requirements §11), and nothing else
      # in this repository can see whether that works — every unit test stubs the writer, because
      # a jsdom `Blob` is not a browser download. That check runs twice: over the served `dist/`,
      # and again with the unpacked extension loaded, driving
      # `chrome-extension://<id>/src/panel/panel.html` — the origin and CSP a DevTools panel
      # document actually has. The second pass needs the FULL `chromium` build, which the install
      # step above already fetches for the harness e2e.
      - name: Visual gate
        run: pnpm screenshot:panel

  release:
    name: package and attach to release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify build output
        run: pnpm verify:build

      - name: Package
        run: pnpm package

      # Chrome Web Store upload stays manual (decision D8): the first submission has to be
      # manual anyway, and it keeps CWS API credentials out of the repo.
      - name: Attach zip to the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: packages/devtools/ag-ui-devtools-*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
