name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: typecheck, lint, test, build, visual gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No `version:` input on purpose. pnpm/action-setup reads the pnpm version from the
      # root package.json `packageManager` field (pinned to pnpm 10), and it fails with
      # "Multiple versions of pnpm specified" if a `version:` input disagrees with it.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # The harness e2e loads the unpacked extension, which needs the FULL chromium build.
      # `chromium-headless-shell` launches fine, loads no extension, registers no service
      # worker, and reports no error — so without this the e2e would pass having tested
      # nothing. It must also run before Test, since `pnpm test` includes the e2e.
      - name: Install Chromium for the harness e2e
        run: pnpm --filter ag-ui-harness exec playwright install --with-deps chromium

      # The harness e2e asserts against a real `dist/`, so build before testing rather
      # than after. The devtools unit suites do not depend on it either way.
      - name: Build
        run: pnpm build

      # `pnpm test` at the root resolves through `pnpm -r run test:ci`, NOT `pnpm -r test`.
      # pnpm treats `test` as a lifecycle name and `pnpm -r test` exits 0 when no package
      # defines it, which would let this job report green having run zero tests.
      - name: Test
        run: pnpm test

      # Asserts things no other gate can see: that each manifest entry's emitted chunk holds
      # the code it should (a basename collision silently swapped two of them once), that the
      # privacy invariants hold in the built manifest, that the panel HTML reached dist/, and
      # that no sourcemap did.
      - name: Verify build output
        run: pnpm verify:build

      # Everything below installs the browser the visual gate drives. It sits after the cheap
      # gates on purpose: a typecheck, lint, test, build or verify failure should not pay for
      # a Chromium download first.
      #
      # `pnpm exec` is filtered to the package because Playwright is a devDependency of
      # `ag-ui-devtools` and NOT of the workspace root, so a bare `pnpm exec playwright` at the
      # root fails with "Command 'playwright' not found".
      - name: Resolve the Playwright version
        id: playwright
        run: |
          version="$(pnpm --filter ag-ui-devtools exec playwright --version | awk '{print $2}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Keyed on Playwright's own version, not the lockfile hash: Playwright pins the exact
      # Chromium build it can drive, so a cache entry is only reusable while that version is
      # unchanged. No `restore-keys` for the same reason — a prefix match here would restore a
      # Chromium the installed Playwright refuses to launch.
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # `chromium-headless-shell`, not `chromium`: measured, that is 199 MB / 7.0s instead of
      # 558 MB / 13.7s, and it is what `chromium.launch()` actually starts — the script never
      # asks for a headed browser, and Playwright resolves a default headless launch to the
      # shell. Its `--with-deps` group is `chromium`, so the apt packages installed are the same
      # ones. If the script ever needs a headed run, this has to go back to `chromium`; the
      # failure if it does not is Playwright's own "executable doesn't exist" error.
      - name: Install the Chromium headless shell
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter ag-ui-devtools exec playwright install --with-deps chromium-headless-shell

      # The cache carries the browser but not the apt packages it links against, so a cache hit
      # still has to install the system libraries — just not re-download the browser.
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter ag-ui-devtools exec playwright install-deps chromium

      # WHY THIS STEP EXISTS. Every gate above it — typecheck, lint, test, build, verify:build —
      # passed on the previous milestone's `dist/`, whose panel had NO STYLESHEET AT ALL. None of
      # them renders anything, so none of them could see it: the panel document is isolated and
      # inherits nothing, and with no CSS it fell back to UA defaults — black text on a
      # transparent ground, invisible under the DevTools dark theme. A human loading the unpacked
      # extension was the only thing that caught it. Leaving that set as the whole gate means the
      # next regression of that class ships. This step is the human, automated: it loads the
      # built panel in a real browser, asserts it is painted in both colour schemes and that the
      # two differ, and drives the fixtures through the panel's own file input to prove real data
      # renders.
      - name: Visual gate
        run: pnpm screenshot:panel

  release:
    name: package and attach to release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify build output
        run: pnpm verify:build

      - name: Package
        run: pnpm package

      # Chrome Web Store upload stays manual (decision D8): the first submission has to be
      # manual anyway, and it keeps CWS API credentials out of the repo.
      - name: Attach zip to the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: packages/devtools/ag-ui-devtools-*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
